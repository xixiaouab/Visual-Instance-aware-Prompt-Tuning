seed: 42
device: cuda

model:
  image_size: 224
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
  num_classes: 1000
  num_instance_prompts: 4
  num_dataset_prompts: 4
  pca_dim: 384
  prompt_layers: null

optim:
  lr: 0.0005
  weight_decay: 0.05
  epochs: 50

data:
  train_manifest: data/train.jsonl
  val_manifest: data/val.jsonl
  image_root: data/images
  batch_size: 32
  num_workers: 4
